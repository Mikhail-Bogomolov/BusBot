services:
  bot:
    build: .
    restart: unless-stopped
    init: true            # reaps Chromium child processes
    shm_size: "1gb"       # Chromium crashes with Docker's default 64 MB /dev/shm
    env_file: .env
    environment:
      DB_PATH: /data/bot.sqlite3
      YANDEX_PROFILE_DIR: /data/chromium
      YANDEX_DUMP_DIR: /data/yandex_dump
    volumes:
      - ./data:/data
